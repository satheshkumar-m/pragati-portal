<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Pragati Learn — one-time setup</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="topbar"><div class="wrap"><a class="brand" href="index.html">Pragati Learn <small>setup</small></a></div></div>
<div class="wrap">
  <div class="card">
    <h1>One-time setup</h1>
    <p class="muted">Creates the database structure, the admin account, a test student and parent, and week-1 content. Safe to run again; anything that already exists is skipped. Delete this file from the server once you are done.</p>
    <div class="grid2">
      <div>
        <label>PocketBase superuser email</label>
        <input id="su_email" value="b2bstore9@gmail.com">
      </div>
      <div>
        <label>PocketBase superuser password</label>
        <input id="su_pass" type="password" placeholder="from the Hostinger message">
      </div>
    </div>
    <h3 style="margin-top:16px">Accounts to create</h3>
    <div class="grid2">
      <div><label>Admin login email (you)</label><input id="admin_email" value="admin@pragatilearn.in"></div>
      <div><label>Admin password</label><input id="admin_pass" type="password" placeholder="choose a strong one"></div>
      <div><label>Test student email</label><input id="student_email" value="student@test.pragatilearn.in"></div>
      <div><label>Test parent email</label><input id="parent_email" value="parent@test.pragatilearn.in"></div>
      <div><label>Password for both test accounts</label><input id="test_pass" value="Test1234!"></div>
    </div>
    <p style="margin-top:16px"><button id="run">Run setup</button></p>
    <div id="log"></div>
  </div>
</div>
<script src="js/pb.js"></script>
<script src="js/setup.js"></script>
</body>
</html>
